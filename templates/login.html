<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Login to your Crispy House account." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Crispy House</title>

    <link rel="stylesheet" href="../static/css/style.css" />
  </head>

  <body>
    <!-- Header -->
    <header class="main-header">
      <div class="logo">
        <a href="index.html">Crispy House</a>
      </div>

      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="order.html">Order Now</a></li>
          <li><a href="login.html" class="active">Login</a></li>
          <li><a href="cart.html">Cart</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- Login Hero -->
      <section class="order-hero">
        <p class="section-subtitle">WELCOME BACK</p>
        <h1>Login</h1>
        <p>Login to your account to order your favorite crispy meals.</p>
      </section>

      <!-- Login Section -->
      <section class="auth-section">
        <div class="auth-card">
          <!--
            BACK-END NOTE (for Python / SQL teammates):
            - Add the form "action" (the login route) when the route is ready.
            - Field names sent to the server: "email" and "password".
            - Validation, password checking, sessions, and error messages
              are handled by the Back-End.
          -->
          <form class="auth-form" method="POST">
            <div class="form-group">
              <label for="login-email">Email</label>
              <input
                type="email"
                id="login-email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
              />
            </div>

            <div class="form-group">
              <label for="login-password">Password</label>
              <input
                type="password"
                id="login-password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
            </div>

            <button type="submit" class="confirm-order-button">Login</button>
          </form>

          <p class="auth-switch">
            Don't have an account? <a href="signup.html">Sign Up</a>
          </p>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
      <div class="footer-content">
        <h2>Crispy House</h2>
        <p>Taste the Crunch!</p>

        <nav class="footer-nav">
          <a href="index.html">Home</a>
          <a href="menu.html">Menu</a>
          <a href="order.html">Order Now</a>
        </nav>

        <p class="copyright">&copy; 2026 Crispy House. All Rights Reserved.</p>
      </div>
    </footer>
  </body>
</html>
